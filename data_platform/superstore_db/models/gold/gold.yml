      **Business value:** Cung cấp dữ liệu phễu Lead → Opportunity → Won để đo conversion, win/loss và hiệu quả campaign/channel.
  
      **Build logic:**
      - Rebuild từ `fact_ad_spend`, `fact_crm_funnel`, `fact_sales` và `fact_customer_acquisition`, quy về channel × tháng.
      - CRM/Sales dùng cohort tháng mở lead; Ads dùng calendar month vì chưa có identity bridge cấp impression/click.
      - Tính lại ratio từ aggregate; reach unique không được cộng theo ngày và `source_daily_reach_sum` chỉ dùng audit.
