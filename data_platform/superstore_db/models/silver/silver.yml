version: 2

# File này tách rõ hai khu vực trong từng resource:
# 1) TEST: điều kiện kiểm thử dữ liệu.
# 2) DESCRIPTION: metadata mô tả bảng/cột cho dbt Docs.
models:
  - name: sil_customer_enriched
    description: |-
      **Grain:** 1 version lịch sử của 1 partner (SCD2 — giữ TOÀN BỘ version). Incremental MERGE theo dbt_scd_id. Khi boundary hoặc lookup enrichment đổi, reload toàn bộ versions của partner đó để version cũ vừa đóng được cập nhật.
  
      **Business value:** Cung cấp thông tin khách hàng/nhà cung cấp, phân khúc và địa lý cho các domain thương mại và tài chính.
  
      **Build logic:**
      - Đọc `stg_res_country_state`, `stg_res_country`, `stg_res_partner_res_partner_category_rel`, `stg_res_partner_category`, `snap_res_partner` và join theo FK/business key Odoo trong SQL.
      - Deduplicate nguồn CDC bằng `row_number()` theo business key, ưu tiên `_cdc_ts_ms DESC, _cdc_lsn DESC`.
      - Incremental MERGE theo `dbt_scd_id`; version key phát hiện thay đổi từ mọi nguồn phụ thuộc và chỉ cập nhật row thực sự đổi.
      - Loại record nguồn bị xóa logic khỏi population cuối hoặc lookup enrichment tương ứng.
      - Giữ toàn bộ SCD2; boundary/current/enrichment đổi sẽ reload mọi version của business key liên quan.
    # KHU VỰC 1 — TEST: giữ nguyên logic kiểm thử, tách khỏi metadata mô tả.
    data_tests:
    - scd2_at_most_one_current:
        arguments:
          business_key: partner_id
    - scd2_no_overlaps:
        arguments:
          business_key: partner_id
    - scd2_valid_interval
    - unique:
        arguments:
          column_name: dbt_scd_id
    - not_null:
        arguments:
          column_name: dbt_scd_id
    - not_null:
        arguments:
          column_name: partner_id
    - not_null:
        arguments:
          column_name: commercial_partner_id
    - not_null:
        arguments:
          column_name: is_current
    - not_null:
        arguments:
          column_name: dbt_valid_from
    # KHU VỰC 2 — DESCRIPTION: mô tả đầy đủ cột để hiển thị trong dbt Docs.
    columns:
    - name: dbt_scd_id
      description: Khóa phiên bản SCD2 do dbt Snapshot tạo; mỗi phiên bản lịch sử có một giá trị duy nhất.
    - name: partner_id
      description: Mã định danh partner; dùng liên kết với bản ghi tương ứng ở hệ thống nguồn hoặc model liên quan.
    - name: commercial_partner_id
      description: ID đối tác thương mại gốc trong Odoo, dùng gom các contact thuộc cùng một tổ chức.
    - name: customer_name
      description: Tên hiển thị của customer enriched.
    - name: city
      description: Thuộc tính city của customer enriched trong lớp Silver.
    - name: state
      description: Trạng thái nghiệp vụ của customer enriched.
    - name: zip
      description: Thuộc tính zip của customer enriched trong lớp Silver.
    - name: country
      description: Thuộc tính country của customer enriched trong lớp Silver.
    - name: region
      description: Thuộc tính region của customer enriched trong lớp Silver.
    - name: is_company
      description: Cờ phân biệt doanh nghiệp với cá nhân trong res.partner.
    - name: customer_rank
      description: Điểm xếp hạng khách hàng của Odoo; giá trị lớn hơn 0 cho biết đã có vai trò khách hàng.
    - name: supplier_rank
      description: Điểm xếp hạng nhà cung cấp của Odoo; giá trị lớn hơn 0 cho biết đã có vai trò vendor.
    - name: partner_type
      description: 'Phân loại đối tác theo customer_rank và supplier_rank: customer, vendor hoặc both.'
    - name: email
      description: Thuộc tính email của customer enriched trong lớp Silver.
    - name: phone
      description: Thuộc tính phone của customer enriched trong lớp Silver.
    - name: rfm_profile
      description: Thuộc tính rfm profile của customer enriched trong lớp Silver.
    - name: is_active
      description: Cờ cho biết bản ghi đang hoạt động và được phép sử dụng trong nghiệp vụ.
    - name: is_current
      description: Cờ xác định đây có phải phiên bản SCD2 hiện hành hay không.
    - name: segment
      description: Thuộc tính segment của customer enriched trong lớp Silver.
    - name: dbt_valid_from
      description: Thời điểm phiên bản SCD2 bắt đầu có hiệu lực.
    - name: dbt_valid_to
      description: Thời điểm phiên bản SCD2 hết hiệu lực; NULL nghĩa là phiên bản hiện hành.
    - name: source_cdc_ts_ms
      description: CDC timestamp của nguồn source; dùng phát hiện thay đổi incremental.
    - name: source_cdc_lsn
      description: CDC LSN của nguồn source; dùng phân xử thứ tự sự kiện.
    - name: enrichment_version_key
      description: Khóa phiên bản sau enrichment, dùng phát hiện thay đổi từ các bảng tham chiếu đã join.
    - name: enrichment_updated_at
      description: Thời điểm dữ liệu enrichment được tính lại.

  - name: sil_product_enriched
    description: |-
      **Grain:** 1 product_id × 1 captured product_template version. MERGE theo product_version_id vì một dbt_scd_id của template có thể có nhiều SKU. Khi boundary hoặc lookup/SKU/BOM đổi, reload toàn bộ versions của product_id đó.
  
      **Business value:** Cung cấp thông tin SKU, danh mục, UOM, giá và standard cost cho phân tích bán, mua, kho và sản xuất.
  
      **Build logic:**
      - Đọc `stg_mrp_bom`, `stg_product_product`, `stg_product_category`, `stg_uom_uom`, `snap_product_template` và join theo FK/business key Odoo trong SQL.
      - Deduplicate nguồn CDC bằng `row_number()` theo business key, ưu tiên `_cdc_ts_ms DESC, _cdc_lsn DESC`.
      - Incremental MERGE theo `product_version_id`; version key phát hiện thay đổi từ mọi nguồn phụ thuộc và chỉ cập nhật row thực sự đổi.
      - Loại record nguồn bị xóa logic khỏi population cuối hoặc lookup enrichment tương ứng.
      - Giữ toàn bộ SCD2; boundary/current/enrichment đổi sẽ reload mọi version của business key liên quan.
