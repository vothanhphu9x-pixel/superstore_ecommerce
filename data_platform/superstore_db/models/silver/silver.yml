  - name: sil_ab_test_enriched
    description: |-
      **Grain:** 1 A/B test variant trong snapshot CSV mới nhất. Rebuild table để correction và row bị xóa trong full-file snapshot được phản ánh đúng.
  
      **Business value:** So sánh traffic, conversion, revenue, cost và winner giữa các variant thử nghiệm.
  
      **Build logic:**
      - Đọc `stg_ab_test`.
      - Deduplicate nguồn CDC bằng `row_number()` theo business key, ưu tiên `_cdc_ts_ms DESC, _cdc_lsn DESC`.
      - Rebuild toàn bảng; correction và row biến mất khỏi full-file snapshot được phản ánh, không để dữ liệu cũ tồn tại.
    # KHU VỰC 1 — TEST: giữ nguyên logic kiểm thử, tách khỏi metadata mô tả.
    data_tests:
    - dbt_utils.unique_combination_of_columns:
        arguments:
          combination_of_columns:
          - test_id
          - variant_name
    - unique:
        arguments:
          column_name: variant_id
    - not_null:
        arguments:
          column_name: variant_id
    - not_null:
        arguments:
          column_name: test_id
    - not_null:
        arguments:
          column_name: campaign_id
    - not_null:
        arguments:
          column_name: channel
    - not_null:
        arguments:
          column_name: start_date
    - not_null:
        arguments:
          column_name: end_date
    - not_null:
        arguments:
          column_name: source_version_key
    - not_null:
        arguments:
          column_name: silver_updated_at
    # KHU VỰC 2 — DESCRIPTION: mô tả đầy đủ cột để hiển thị trong dbt Docs.
    columns:
    - name: test_id
      description: Mã định danh test; dùng liên kết với bản ghi tương ứng ở hệ thống nguồn hoặc model liên quan.
    - name: variant_id
