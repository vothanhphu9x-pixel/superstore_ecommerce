version: 2

# File này tách rõ hai khu vực trong từng resource:
# 1) TEST: điều kiện kiểm thử dữ liệu.
# 2) DESCRIPTION: metadata mô tả bảng/cột cho dbt Docs.
snapshots:
  - name: snap_res_partner
    description: |-
      **Grain:** 1 hàng = 1 phiên bản lịch sử SCD2 của một partner_id.
  
      **Business value:** Lưu lịch sử thay đổi của đối tác khách hàng/nhà cung cấp để báo cáo quá khứ không bị ghi đè. Cung cấp thông tin khách hàng/nhà cung cấp, phân khúc và địa lý cho các domain thương mại và tài chính.
  
      **Build logic:**
      - Đọc `stg_res_partner`, deduplicate `partner_id` bằng `_cdc_ts_ms DESC, _cdc_lsn DESC`; Snapshot không join bảng khác.
      - Strategy=check theo `write_date`, `is_deleted`; thay đổi sẽ đóng version cũ và tạo version mới với `dbt_scd_id/dbt_valid_from/dbt_valid_to`.
      - `invalidate_hard_deletes=true` đóng version khi business key biến mất khỏi kết quả snapshot.
    # KHU VỰC 1 — TEST: giữ nguyên logic kiểm thử, tách khỏi metadata mô tả.
    data_tests:
    - dbt_utils.unique_combination_of_columns:
        arguments:
          combination_of_columns:
          - partner_id
          - dbt_valid_from
    - scd2_at_most_one_open:
        arguments:
          business_key: partner_id
    - scd2_no_overlaps:
        arguments:
          business_key: partner_id
    - scd2_valid_interval
    - not_null:
        arguments:
          column_name: partner_id
    - unique:
        arguments:
          column_name: dbt_scd_id
    - not_null:
        arguments:
          column_name: dbt_scd_id
    - not_null:
        arguments:
          column_name: dbt_valid_from
    # KHU VỰC 2 — DESCRIPTION: mô tả đầy đủ cột để hiển thị trong dbt Docs.
    columns:
    - name: partner_id
      description: Mã định danh partner; dùng liên kết với bản ghi tương ứng ở hệ thống nguồn hoặc model liên quan.
    - name: name
      description: Tên hiển thị của res partner.
    - name: is_company
      description: Cờ phân biệt doanh nghiệp với cá nhân trong res.partner.
    - name: parent_id
      description: Mã định danh parent; dùng liên kết với bản ghi tương ứng ở hệ thống nguồn hoặc model liên quan.
    - name: commercial_partner_id
      description: ID đối tác thương mại gốc trong Odoo, dùng gom các contact thuộc cùng một tổ chức.
    - name: customer_rank
      description: Điểm xếp hạng khách hàng của Odoo; giá trị lớn hơn 0 cho biết đã có vai trò khách hàng.
    - name: supplier_rank
      description: Điểm xếp hạng nhà cung cấp của Odoo; giá trị lớn hơn 0 cho biết đã có vai trò vendor.
    - name: state_id
      description: Mã định danh trạng thái; dùng liên kết với bản ghi tương ứng ở hệ thống nguồn hoặc model liên quan.
    - name: country_id
      description: Mã định danh country; dùng liên kết với bản ghi tương ứng ở hệ thống nguồn hoặc model liên quan.
    - name: city
      description: Thuộc tính city của res partner trong lớp Snapshot.
    - name: zip
      description: Thuộc tính zip của res partner trong lớp Snapshot.
    - name: email
      description: Thuộc tính email của res partner trong lớp Snapshot.
    - name: phone
      description: Thuộc tính phone của res partner trong lớp Snapshot.
    - name: comment
      description: Thuộc tính comment của res partner trong lớp Snapshot.
    - name: ref
      description: Thuộc tính ref của res partner trong lớp Snapshot.
    - name: active
      description: Trạng thái active gốc từ Odoo.
    - name: write_date
      description: Ngày write của res partner.
    - name: cdc_status
      description: Trạng thái CDC của bản ghi, ví dụ ACTIVE hoặc DELETED.
    - name: is_deleted
      description: Cờ xóa logic lấy từ CDC; true nghĩa là bản ghi đã bị xóa ở nguồn.
    - name: _cdc_ts_ms
      description: Timestamp của sự kiện CDC theo epoch milliseconds từ Debezium; dùng xác định thứ tự thay đổi nguồn.
    - name: _cdc_lsn
      description: PostgreSQL Log Sequence Number của sự kiện CDC; dùng phân xử khi nhiều sự kiện có cùng CDC timestamp.
    - name: ingested_at
      description: Thời điểm bản ghi được nạp vào Snowflake Bronze/Staging.
    - name: dbt_scd_id
      description: Khóa phiên bản SCD2 do dbt Snapshot tạo; mỗi phiên bản lịch sử có một giá trị duy nhất.
    - name: dbt_updated_at
      description: Thời điểm nguồn thay đổi mà dbt Snapshot dùng để quản lý phiên bản.
    - name: dbt_valid_from
      description: Thời điểm phiên bản SCD2 bắt đầu có hiệu lực.
    - name: dbt_valid_to
      description: NULL = bản ghi hiện hành.

  - name: snap_product_template
    description: |-
      **Grain:** 1 hàng = 1 phiên bản lịch sử SCD2 của một product_tmpl_id.
  
      **Business value:** Lưu lịch sử thay đổi của định nghĩa sản phẩm để báo cáo quá khứ không bị ghi đè. Cung cấp thông tin SKU, danh mục, UOM, giá và standard cost cho phân tích bán, mua, kho và sản xuất.
  
      **Build logic:**
      - Đọc `stg_product_template`, deduplicate `product_tmpl_id` bằng `_cdc_ts_ms DESC, _cdc_lsn DESC`; Snapshot không join bảng khác.
      - Strategy=check theo `list_price`, `write_date`, `is_deleted`; thay đổi sẽ đóng version cũ và tạo version mới với `dbt_scd_id/dbt_valid_from/dbt_valid_to`.
      - `invalidate_hard_deletes=true` đóng version khi business key biến mất khỏi kết quả snapshot.
    # KHU VỰC 1 — TEST: giữ nguyên logic kiểm thử, tách khỏi metadata mô tả.
    data_tests:
    - dbt_utils.unique_combination_of_columns:
        arguments:
          combination_of_columns:
          - product_tmpl_id
          - dbt_valid_from
    - scd2_at_most_one_open:
