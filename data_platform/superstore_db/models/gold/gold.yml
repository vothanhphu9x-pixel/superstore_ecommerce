      - Incremental MERGE theo `crm_lead_id`; reprocess khi source, surrogate key hoặc `dim_updated_at` thay đổi.
      - Giữ `is_deleted` trong Fact; Mart chủ động loại tombstone theo ngữ cảnh KPI.
