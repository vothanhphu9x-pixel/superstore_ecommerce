    # KHU VỰC 1 — TEST: giữ nguyên logic kiểm thử, tách khỏi metadata mô tả.
    data_tests:
    - dbt_utils.unique_combination_of_columns:
        arguments:
          combination_of_columns:
          - month_date_key
          - vendor_sk
    - unique:
        arguments:
          column_name: mart_vendor_perf_sk
    - not_null:
        arguments:
          column_name: mart_vendor_perf_sk
    - not_null:
        arguments:
          column_name: month_date_key
    - relationships:
        arguments:
          column_name: month_date_key
          to: ref('dim_date')
          field: date_key
    - not_null:
        arguments:
          column_name: vendor_sk
    - relationships:
        arguments:
          column_name: vendor_sk
          to: ref('dim_customer')
          field: customer_sk
    - not_null:
        arguments:
          column_name: po_count
    - not_null:
        arguments:
          column_name: receipt_coverage_pct
    - not_null:
        arguments:
          column_name: late_count
    - accepted_values:
        arguments:
          column_name: late_measurement_status
          values:
          - available
          - partial
          - not_available
    # KHU VỰC 2 — DESCRIPTION: mô tả đầy đủ cột để hiển thị trong dbt Docs.
