    - name: employee_id
      description: Mã định danh nhân viên; dùng liên kết với bản ghi tương ứng ở hệ thống nguồn hoặc model liên quan.
    - name: wage
      description: Thuộc tính wage của hr contract trong lớp Snapshot.
    - name: date_start
      description: Ngày start của hr contract.
    - name: date_end
      description: Ngày end của hr contract.
    - name: state
      description: Trạng thái nghiệp vụ của hr contract.
    - name: cdc_status
      description: Trạng thái CDC của bản ghi, ví dụ ACTIVE hoặc DELETED.
    - name: is_deleted
      description: Cờ xóa logic lấy từ CDC; true nghĩa là bản ghi đã bị xóa ở nguồn.
    - name: _cdc_ts_ms
      description: Timestamp của sự kiện CDC theo epoch milliseconds từ Debezium; dùng xác định thứ tự thay đổi nguồn.
    - name: _cdc_lsn
      description: PostgreSQL Log Sequence Number của sự kiện CDC; dùng phân xử khi nhiều sự kiện có cùng CDC timestamp.
    - name: ingested_at
