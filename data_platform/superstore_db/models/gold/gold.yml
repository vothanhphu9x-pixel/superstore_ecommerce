version: 2

# File này tách rõ hai khu vực trong từng resource:
# 1) TEST: điều kiện kiểm thử dữ liệu.
# 2) DESCRIPTION: metadata mô tả bảng/cột cho dbt Docs.
models:
  - name: dim_customer
    description: |
      **Grain:** 1 hàng = 1 phiên bản lịch sử SCD2 của một `partner_id`.
      Một partner có thể có nhiều hàng theo thời gian; `dbt_scd_id` và `customer_sk`
      xác định duy nhất từng phiên bản.
  
      **Business value:** Cung cấp dimension khách hàng/nhà cung cấp dùng chung cho
      Sales, CRM, Purchase, Invoice và Payment. Bảng hỗ trợ phân tích đúng lịch sử
      theo thời điểm phát sinh giao dịch, đồng thời cung cấp phân khúc khách hàng,
      khu vực địa lý, loại partner và trạng thái hoạt động.
  
      **Build logic:** Gold đọc toàn bộ phiên bản từ `sil_customer_enriched` và MERGE
      theo `dbt_scd_id`; không lọc chỉ lấy bản hiện hành. Silver lấy SCD2 từ
      `snap_res_partner`, loại `is_deleted = true`, sau đó enrich bằng tag khách hàng,
      state và country. Các lookup được deduplicate bằng `row_number()` theo business
      key, sắp xếp `_cdc_ts_ms` và `_cdc_lsn` giảm dần. Segment được tổng hợp từ các
      tag Consumer, Corporate và Home Office; region được suy từ state/country.
      Khi xuất hiện version mới, version cũ bị đóng, trạng thái `is_current` thay đổi
      hoặc lookup enrichment thay đổi, Silver tải lại toàn bộ lịch sử của partner đó.
      Gold tạo `customer_sk`, giữ `dbt_valid_from/dbt_valid_to` và bổ sung timestamp
      vận hành để Fact có thể temporal join và reprocess khi dimension thay đổi.
    # KHU VỰC 1 — TEST: giữ nguyên logic kiểm thử, tách khỏi metadata mô tả.
    data_tests:
    - scd2_at_most_one_current:
        arguments:
          business_key: partner_id
    - scd2_no_overlaps:
        arguments:
          business_key: partner_id
    - scd2_valid_interval
    - unique:
        arguments:
          column_name: customer_sk
    - not_null:
        arguments:
          column_name: customer_sk
    - unique:
        arguments:
          column_name: dbt_scd_id
    - not_null:
        arguments:
          column_name: dbt_scd_id
    - not_null:
        arguments:
          column_name: partner_id
    - not_null:
        arguments:
          column_name: commercial_partner_id
    - not_null:
        arguments:
          column_name: is_current
    - not_null:
        arguments:
          column_name: dbt_valid_from
    # KHU VỰC 2 — DESCRIPTION: mô tả đầy đủ cột để hiển thị trong dbt Docs.
    columns:
    - name: customer_sk
      description: Khóa thay thế của khách hàng, dùng join trong mô hình dimensional.
    - name: partner_id
      description: Mã định danh partner; dùng liên kết với bản ghi tương ứng ở hệ thống nguồn hoặc model liên quan.
    - name: commercial_partner_id
      description: ID đối tác thương mại gốc trong Odoo, dùng gom các contact thuộc cùng một tổ chức.
    - name: customer_name
      description: Tên hiển thị của customer.
    - name: segment
      description: Thuộc tính segment của customer trong lớp Gold.
    - name: city
      description: Thuộc tính city của customer trong lớp Gold.
    - name: state
      description: Trạng thái nghiệp vụ của customer.
    - name: zip
      description: Thuộc tính zip của customer trong lớp Gold.
    - name: country
      description: Thuộc tính country của customer trong lớp Gold.
    - name: region
      description: Thuộc tính region của customer trong lớp Gold.
    - name: is_company
      description: Cờ phân biệt doanh nghiệp với cá nhân trong res.partner.
    - name: customer_rank
      description: Điểm xếp hạng khách hàng của Odoo; giá trị lớn hơn 0 cho biết đã có vai trò khách hàng.
    - name: supplier_rank
      description: Điểm xếp hạng nhà cung cấp của Odoo; giá trị lớn hơn 0 cho biết đã có vai trò vendor.
    - name: partner_type
      description: 'Phân loại đối tác theo customer_rank và supplier_rank: customer, vendor hoặc both.'
    - name: email
      description: Thuộc tính email của customer trong lớp Gold.
    - name: phone
      description: Thuộc tính phone của customer trong lớp Gold.
    - name: rfm_profile
      description: Thuộc tính rfm profile của customer trong lớp Gold.
    - name: is_active
      description: Cờ cho biết bản ghi đang hoạt động và được phép sử dụng trong nghiệp vụ.
    - name: is_current
      description: Cờ xác định đây có phải phiên bản SCD2 hiện hành hay không.
    - name: dbt_valid_from
      description: Thời điểm phiên bản SCD2 bắt đầu có hiệu lực.
    - name: dbt_valid_to
      description: Thời điểm phiên bản SCD2 hết hiệu lực; NULL nghĩa là phiên bản hiện hành.
    - name: dbt_scd_id
      description: Khóa phiên bản SCD2 do dbt Snapshot tạo; mỗi phiên bản lịch sử có một giá trị duy nhất.
    - name: source_cdc_ts_ms
      description: CDC timestamp của nguồn source; dùng phát hiện thay đổi incremental.
    - name: source_cdc_lsn
      description: CDC LSN của nguồn source; dùng phân xử thứ tự sự kiện.
    - name: enrichment_version_key
      description: Khóa phiên bản sau enrichment, dùng phát hiện thay đổi từ các bảng tham chiếu đã join.
    - name: enrichment_updated_at
      description: Thời điểm dữ liệu enrichment được tính lại.
    - name: dim_updated_at
      description: Thời điểm phiên bản Dimension được refresh; dùng phát hiện dimension thay đổi để re-key Fact.
    - name: dbt_updated_at
      description: Thời điểm nguồn thay đổi mà dbt Snapshot dùng để quản lý phiên bản.
    - name: gold_refreshed_at
      description: Thời điểm model Gold được refresh; chỉ phục vụ vận hành, không xác định hiệu lực business.

  - name: dim_product
    description: |-
      **Grain:** 1 product_id × 1 captured product_template version.
  
      **Business value:** Cung cấp thông tin SKU, danh mục, UOM, giá và standard cost cho phân tích bán, mua, kho và sản xuất.
  
      **Build logic:**
      - Đọc `sil_product_enriched`.
      - Incremental MERGE theo `product_version_id`; reprocess khi source, surrogate key hoặc `dim_updated_at` thay đổi.
      - Tạo surrogate key; SCD2 dimension giữ lịch sử, SCD1 dimension giữ trạng thái hiện hành theo thiết kế.
