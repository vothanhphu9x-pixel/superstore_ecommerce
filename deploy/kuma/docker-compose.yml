name: superstore-kuma

services:
  uptime-kuma:
    image: ${KUMA_IMAGE:?Set KUMA_IMAGE to a pinned digest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3001"
    volumes:
      - uptime_kuma_data:/app/data
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  uptime_kuma_data:
