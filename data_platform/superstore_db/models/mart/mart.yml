version: 2

# File này tách rõ hai khu vực trong từng resource:
# 1) TEST: điều kiện kiểm thử dữ liệu.
# 2) DESCRIPTION: metadata mô tả bảng/cột cho dbt Docs.
models:
  - name: mart_revenue_monthly
    description: |-
      **Grain:** 1 month × 1 customer region × 1 product category_l1.
  
      **Business value:** Cung cấp doanh thu, COGS và lợi nhuận gộp theo tháng, khu vực và danh mục sản phẩm.
  
      **Build logic:**
      - Đọc `fact_sales`, `dim_date`, `dim_customer`, `dim_product`, join bằng surrogate key đã resolve tại Gold và aggregate về grain báo cáo.
      - Rebuild toàn bảng để correction/backfill và aggregate group biến mất không bị sót.
      - Tính lại ratio từ tổng tử số/mẫu số; loại tombstone, trạng thái hủy hoặc dòng thiếu điều kiện KPI theo WHERE của mart.
    # KHU VỰC 1 — TEST: giữ nguyên logic kiểm thử, tách khỏi metadata mô tả.
    data_tests:
    - dbt_utils.unique_combination_of_columns:
        arguments:
          combination_of_columns:
          - month_date_key
          - region
          - category_l1
    - unique:
        arguments:
          column_name: mart_revenue_sk
    - not_null:
        arguments:
          column_name: mart_revenue_sk
    - not_null:
        arguments:
          column_name: month_date_key
    - relationships:
        arguments:
          column_name: month_date_key
          to: ref('dim_date')
          field: date_key
    - not_null:
        arguments:
          column_name: region
    - not_null:
        arguments:
          column_name: category_l1
    - not_null:
        arguments:
          column_name: revenue_amount
    - not_null:
        arguments:
          column_name: missing_cost_line_count
    # KHU VỰC 2 — DESCRIPTION: mô tả đầy đủ cột để hiển thị trong dbt Docs.
    columns:
    - name: mart_revenue_sk
      description: Khóa thay thế duy nhất của Mart tại grain tổng hợp revenue monthly.
    - name: src_fact_sales_sk
      description: Khóa Fact nguồn đại diện, dùng truy vết lineage từ mart về dữ liệu chi tiết.
    - name: region
      description: Thuộc tính region của revenue monthly trong lớp Mart.
    - name: category_l1
      description: Thuộc tính category l1 của revenue monthly trong lớp Mart.
    - name: month_date_key
      description: Khóa ngày đầu tháng dạng YYYYMMDD, đại diện kỳ tổng hợp tháng.
    - name: sale_line_count
      description: Số lượng sale line tại grain của model.
    - name: sales_order_count
      description: Số lượng sales đơn hàng tại grain của model.
    - name: revenue_amount
      description: Giá trị tiền doanh thu đã chuẩn hóa theo naming convention của warehouse.
    - name: cogs_amount
      description: Giá trị tiền cogs đã chuẩn hóa theo naming convention của warehouse.
    - name: gross_profit_amount
      description: Lợi nhuận gộp, được tính bằng revenue_amount trừ cost_amount.
    - name: missing_cost_line_count
      description: Số dòng doanh thu thiếu cost để tính lợi nhuận gộp.

  - name: mart_vendor_performance
    description: |-
      **Grain:** 1 purchase order month × 1 vendor version key.
  
