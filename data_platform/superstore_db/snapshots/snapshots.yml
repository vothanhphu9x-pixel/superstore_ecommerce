      **Business value:** Lưu lịch sử thay đổi của hợp đồng lao động để báo cáo quá khứ không bị ghi đè. Cung cấp quan hệ nhân viên–hợp đồng–user để phân tích salesperson, buyer và nguồn lực.
  
      **Build logic:**
      - Đọc `stg_hr_contract`, deduplicate `contract_id` bằng `_cdc_ts_ms DESC, _cdc_lsn DESC`; Snapshot không join bảng khác.
