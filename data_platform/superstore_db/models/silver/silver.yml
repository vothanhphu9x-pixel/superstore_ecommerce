  - name: sil_channel_enriched
    description: |-
      **Grain:** 1 channel (static — không SCD2). Nguồn chính: explode cột channels của campaign master. Bổ sung direct/organic/referral từ UTM medium để đơn không có paid campaign vẫn có attribution trung thực và không bị dồn vào NULL. utm_medium mặc định của Odoo (VD "Email", "Google Adwords") không khớp channel_code snake_case của CSV. superstore_data_generator.py tạo/bổ sung các code chuẩn qua ORM; lower(name) bảo vệ riêng trường hợp medium mặc định "Direct" dùng title case. channel_group là business classification tự derive (Paid/Organic/Email theo tiền tố channel_code), KHÔNG phải field nguồn nào — cần xác nhận với BA trước khi dùng production.
  
      **Business value:** Chuẩn hóa source/medium/channel để so sánh và attribution hiệu quả đa kênh.
  
      **Build logic:**
      - Đọc `stg_marketing_campaigns_master`, `stg_utm_medium` và join theo FK/business key Odoo trong SQL.
      - Deduplicate nguồn CDC bằng `row_number()` theo business key, ưu tiên `_cdc_ts_ms DESC, _cdc_lsn DESC`.
      - Rebuild toàn bảng; correction và row biến mất khỏi full-file snapshot được phản ánh, không để dữ liệu cũ tồn tại.
      - Loại record nguồn bị xóa logic khỏi population cuối hoặc lookup enrichment tương ứng.
