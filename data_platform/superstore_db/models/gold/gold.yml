      - Đọc `sil_ab_test_enriched`, `dim_channel`, `dim_campaign` và join dimension/lookup theo khóa trong SQL.
      - Rebuild toàn bảng để correction, reclassification và row/group biến mất được phản ánh đầy đủ.
