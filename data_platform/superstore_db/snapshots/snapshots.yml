    columns:
    - name: product_tmpl_id
      description: Mã định danh sản phẩm tmpl; dùng liên kết với bản ghi tương ứng ở hệ thống nguồn hoặc model liên quan.
    - name: name
      description: Tên hiển thị của product template.
    - name: type
      description: Thuộc tính loại của product template trong lớp Snapshot.
    - name: is_storable
      description: Cờ cho biết sản phẩm được quản lý tồn kho.
    - name: categ_id
      description: Mã định danh categ; dùng liên kết với bản ghi tương ứng ở hệ thống nguồn hoặc model liên quan.
    - name: list_price
      description: Thuộc tính list giá của product template trong lớp Snapshot.
    - name: sale_ok
      description: Thuộc tính sale ok của product template trong lớp Snapshot.
    - name: purchase_ok
      description: Thuộc tính purchase ok của product template trong lớp Snapshot.
    - name: tracking
      description: Thuộc tính tracking của product template trong lớp Snapshot.
    - name: uom_id
      description: Mã định danh uom; dùng liên kết với bản ghi tương ứng ở hệ thống nguồn hoặc model liên quan.
    - name: cdc_status
      description: Trạng thái CDC của bản ghi, ví dụ ACTIVE hoặc DELETED.
    - name: is_deleted
      description: Cờ xóa logic lấy từ CDC; true nghĩa là bản ghi đã bị xóa ở nguồn.
    - name: _cdc_ts_ms
      description: Timestamp của sự kiện CDC theo epoch milliseconds từ Debezium; dùng xác định thứ tự thay đổi nguồn.
    - name: _cdc_lsn
      description: PostgreSQL Log Sequence Number của sự kiện CDC; dùng phân xử khi nhiều sự kiện có cùng CDC timestamp.
    - name: write_date
      description: Ngày write của product template.
    - name: ingested_at
      description: Thời điểm bản ghi được nạp vào Snowflake Bronze/Staging.
    - name: dbt_scd_id
      description: Khóa phiên bản SCD2 do dbt Snapshot tạo; mỗi phiên bản lịch sử có một giá trị duy nhất.
    - name: dbt_updated_at
