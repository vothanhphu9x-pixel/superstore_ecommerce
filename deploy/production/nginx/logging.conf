map $uri $superstore_route {
    default "unmatched";

    ~^/api/(health/live|staff/(login|logout|me)|dashboard(/(kpi|revenue-trend|by-category|by-region|top-products))?)/?$ $uri;
}

log_format superstore_json escape=json
    '{"time":"$time_iso8601",'
    '"service":"nginx",'
    '"method":"$request_method",'
    '"route":"$superstore_route",'
    '"status":$status,'
    '"duration":$request_time,'
    '"upstream_duration":"$upstream_response_time",'
    '"request_id":"$upstream_http_x_request_id"}';