    - name: receipt_coverage_pct
      description: Tỷ lệ dòng mua hàng có dữ liệu movement nhận hàng để đo SLA.
    - name: on_time_delivery_pct
      description: Tỷ lệ giao hoặc nhận hàng đúng hạn.
    - name: late_delivery_pct
      description: Tỷ lệ giao hoặc nhận hàng trễ.
    - name: avg_days_late
