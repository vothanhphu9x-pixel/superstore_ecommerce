  - name: fact_inventory_balance
    description: |-
      **Grain:** 1 hàng = 1 product × 1 location × 1 snapshot_date.
  
      **Business value:** Theo dõi tồn on-hand, reserved và available theo sản phẩm, vị trí và thời điểm.
  
      **Build logic:**
      - Đọc `stg_stock_quant`, deduplicate theo `stock_quant_id`, loại tombstone rồi cộng về product × location; join `dim_product` theo processing time và `dim_location` theo location_id.
      - Delete+insert partition ngày hiện tại giúp rerun cùng ngày idempotent và đưa quant biến mất về 0; `full_refresh=false` bảo vệ lịch sử ngày trước.
      - Tạo `quantity_available = quantity - reserved_quantity` và `snapshot_captured_at` cho temporal join.
    # KHU VỰC 1 — TEST: giữ nguyên logic kiểm thử, tách khỏi metadata mô tả.
    data_tests:
