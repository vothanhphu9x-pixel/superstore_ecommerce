  - name: fact_crm_funnel
    description: |-
      **Grain:** 1 hàng = 1 crm_lead.
  
      **Business value:** Cung cấp dữ liệu phễu Lead → Opportunity → Won để đo conversion, win/loss và hiệu quả campaign/channel.
  
      **Build logic:**
      - Đọc `stg_crm_stage`, `stg_crm_lost_reason`, `stg_utm_medium`, `sil_crm_lead_enriched`, `dim_channel`, `dim_customer`, `dim_campaign` và join dimension/lookup theo khóa trong SQL.
