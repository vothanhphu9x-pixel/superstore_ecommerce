  - name: dim_employee
    description: |-
      **Grain:** 1 hàng = 1 VERSION LỊCH SỬ của 1 hr_contract (SCD2 đầy đủ — xem giải thích đổi kiến trúc ở dim_customer, cùng lý do/cùng ngày). is_current=true = bản hiện hành.
  
      **Business value:** Cung cấp quan hệ nhân viên–hợp đồng–user để phân tích salesperson, buyer và nguồn lực.
  
      **Build logic:**
      - Đọc `sil_employee_enriched`.
      - Incremental MERGE theo `dbt_scd_id`; reprocess khi source, surrogate key hoặc `dim_updated_at` thay đổi.
