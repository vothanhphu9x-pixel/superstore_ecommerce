  - name: dim_campaign
    description: |-
      **Grain:** 1 campaign (static — không SCD2).
  
      **Business value:** Chuẩn hóa campaign Odoo và marketing ngoài hệ thống để attribution dùng chung một định danh.
  
      **Build logic:**
      - Đọc `sil_campaign_enriched`.
      - Rebuild toàn bảng để correction, reclassification và row/group biến mất được phản ánh đầy đủ.
      - Tạo surrogate key; SCD2 dimension giữ lịch sử, SCD1 dimension giữ trạng thái hiện hành theo thiết kế.
    # KHU VỰC 1 — TEST: giữ nguyên logic kiểm thử, tách khỏi metadata mô tả.
    data_tests:
    - unique:
        arguments:
          column_name: campaign_sk
    - not_null:
        arguments:
          column_name: campaign_sk
    - unique:
        arguments:
          column_name: campaign_id
    - not_null:
        arguments:
          column_name: campaign_id
    - unique:
        arguments:
          column_name: utm_campaign_id
    - not_null:
        arguments:
          column_name: utm_campaign_id
    # KHU VỰC 2 — DESCRIPTION: mô tả đầy đủ cột để hiển thị trong dbt Docs.
    columns:
