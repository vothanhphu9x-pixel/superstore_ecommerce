  - name: fact_customer_acquisition
    description: |-
      **Grain:** 1 commercial customer đã có ít nhất 1 confirmed order.
  
      **Business value:** Theo dõi nguồn thu hút khách hàng, CAC, LTV, payback và hành vi mua lại để đánh giá chất lượng tăng trưởng.
  
      **Build logic:**
      - Rebuild từ `fact_sales`, `dim_customer` và `fact_ad_spend`; xác định confirmed order đầu tiên của commercial customer.
      - Gán campaign/channel của đơn đầu tiên và phân bổ paid spend cùng ngày cho khách mới trong cùng campaign × channel.
      - Full recompute để order/spend mới cập nhật LTV, payback và attribution của khách cũ.
