  - name: sil_order_lines_enriched
    description: |-
      **Grain:** 1 sale_order_line hiện hành. CDC của line/header chỉ dùng phát hiện thay đổi. silver_updated_at là thời điểm dòng thực sự được INSERT/UPDATE tại Silver; date_order chỉ phục vụ phân tích business time.
  
      **Business value:** Đo đơn bán, số lượng, doanh thu, giá vốn, lợi nhuận gộp và attribution bán hàng.
  
      **Build logic:**
      - Đọc `stg_sale_order`, `stg_sale_order_line` và join theo FK/business key Odoo trong SQL.
      - Deduplicate nguồn CDC bằng `row_number()` theo business key, ưu tiên `_cdc_ts_ms DESC, _cdc_lsn DESC`.
      - Incremental MERGE theo `sale_order_line_id`; version key phát hiện thay đổi từ mọi nguồn phụ thuộc và chỉ cập nhật row thực sự đổi.
      - Không loại tombstone; giữ `is_deleted` để Gold xử lý delete đúng nghiệp vụ.
    # KHU VỰC 1 — TEST: giữ nguyên logic kiểm thử, tách khỏi metadata mô tả.
    data_tests:
    - unique:
        arguments:
          column_name: sale_order_line_id
    - not_null:
        arguments:
          column_name: sale_order_line_id
    - not_null:
