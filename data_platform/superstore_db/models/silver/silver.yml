  - name: sil_campaign_enriched
    description: |-
      **Grain:** 1 campaign (static — không SCD2). campaign_id của CSV là utm_campaign.id thật. JOIN bằng ID kỹ thuật đã xác minh; tên chỉ là thuộc tính hiển thị, không dùng làm khóa. source_name lấy qua crm_lead.source_id phổ biến nhất của campaign (utm_campaign không có FK trực tiếp tới utm_source) — có thể NULL nếu campaign chưa gắn lead nào.
  
      **Business value:** Chuẩn hóa campaign Odoo và marketing ngoài hệ thống để attribution dùng chung một định danh.
  
      **Build logic:**
      - Đọc `stg_marketing_campaigns_master`, `stg_utm_campaign`, `stg_crm_lead`, `stg_utm_source`, `stg_utm_medium` và join theo FK/business key Odoo trong SQL.
      - Deduplicate nguồn CDC bằng `row_number()` theo business key, ưu tiên `_cdc_ts_ms DESC, _cdc_lsn DESC`.
      - Rebuild toàn bảng; correction và row biến mất khỏi full-file snapshot được phản ánh, không để dữ liệu cũ tồn tại.
      - Loại record nguồn bị xóa logic khỏi population cuối hoặc lookup enrichment tương ứng.
