      **Business value:** Đo đơn bán, số lượng, doanh thu, giá vốn, lợi nhuận gộp và attribution bán hàng.
  
      **Build logic:**
      - Đọc `sil_order_lines_enriched`, `dim_customer`, `dim_product`, `dim_employee`, `dim_warehouse`, `dim_campaign`, `stg_utm_medium`, `dim_channel` và join dimension/lookup theo khóa trong SQL.
      - Temporal join SCD2 bằng business ID và processing time nằm trong `[dbt_valid_from, dbt_valid_to)`; không kẹp Fact cũ vào version đầu tiên.
      - Incremental MERGE theo `sale_order_line_id`; reprocess khi source, surrogate key hoặc `dim_updated_at` thay đổi.
      - Giữ `is_deleted` trong Fact; Mart chủ động loại tombstone theo ngữ cảnh KPI.
