    - name: mart_vendor_perf_sk
      description: Khóa thay thế duy nhất của Mart tại grain tổng hợp vendor performance.
    - name: src_fact_purchase_sk
      description: Khóa Fact nguồn đại diện, dùng truy vết lineage từ mart về dữ liệu chi tiết.
    - name: vendor_sk
      description: Khóa thay thế của nhà cung cấp, dùng join trong mô hình dimensional.
    - name: month_date_key
      description: Khóa ngày đầu tháng dạng YYYYMMDD, đại diện kỳ tổng hợp tháng.
    - name: purchase_line_count
      description: Số lượng purchase line tại grain của model.
    - name: po_count
      description: Số lượng po tại grain của model.
    - name: qty_received
      description: Số lượng received tại grain của model.
    - name: product_qty
      description: Số lượng sản phẩm tại grain của model.
    - name: fill_rate_pct
      description: Tỷ lệ số lượng đã nhận trên số lượng đặt mua.
    - name: purchase_amount
      description: Giá trị tiền purchase đã chuẩn hóa theo naming convention của warehouse.
    - name: received_line_count
      description: Số lượng received line tại grain của model.
    - name: on_time_count
