  - name: sil_invoice_payment_status
    description: |-
      **Grain:** 1 account_partial_reconcile hiện hành = 1 allocation nối payment line với invoice line. CDC của reconcile/invoice/payment/journal chỉ dùng phát hiện thay đổi. silver_updated_at chỉ đổi khi source_version_key hoặc aging_bucket thực sự đổi. invoice_date/payment_date là business time, không dùng để chọn version SCD2.
  
      **Business value:** Nối payment với invoice để tính allocation, DSO, overdue, aging và dòng tiền thu.
  
      **Build logic:**
      - Đọc `stg_account_move`, `stg_account_payment`, `stg_account_journal`, `stg_account_partial_reconcile` và join theo FK/business key Odoo trong SQL.
      - Deduplicate nguồn CDC bằng `row_number()` theo business key, ưu tiên `_cdc_ts_ms DESC, _cdc_lsn DESC`.
      - Incremental MERGE theo `account_partial_reconcile_id`; version key phát hiện thay đổi từ mọi nguồn phụ thuộc và chỉ cập nhật row thực sự đổi.
      - Không loại tombstone; giữ `is_deleted` để Gold xử lý delete đúng nghiệp vụ.
